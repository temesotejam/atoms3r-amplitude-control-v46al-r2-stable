name: Seed V46al-R2 stable snapshot

on:
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  seed:
    if: github.repository == 'temesotejam/atoms3r-amplitude-control-v46al-r2-stable'
    runs-on: ubuntu-latest
    steps:
      - name: Seed all source blobs into target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: 759124cf7a58756eb4619aef36ed796576f312af
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/temesotejam/atoms3r-amplitude-control-development.git source
          cd source
          git checkout "$SOURCE_SHA"
          if [ -d .github/workflows ]; then
            mv .github/workflows .github/workflows-snapshot
          fi
          rm -rf .git
          git init -b stable-import
          git config user.name "stable-snapshot-import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Seed V46al-R2 verified snapshot blobs"
          git remote add target "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push --force target HEAD:refs/heads/snapshot-import
